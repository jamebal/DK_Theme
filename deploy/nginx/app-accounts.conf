# Include inside the theme site's server {} block.
# Replace xboard.example.com with the actual Xboard API hostname.
# Keep the JSON file OUTSIDE every website root/alias directory.
# CORS allows the theme origin https://theme.example.com; change it if needed.
location = /api/v1/user/app-accounts {
    # Preflight has no login token. Return no content before authentication.
    if ($request_method = OPTIONS) { return 204; }
    if ($http_authorization = "") { return 401; }
    limit_except GET OPTIONS { deny all; }
    satisfy all;
    auth_request /_app_accounts_auth;

    alias /etc/moss-private/app-accounts.json;
    default_type application/json;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "https://theme.example.com" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Cache-Control" always;
    etag off;
    if_modified_since off;
    expires off;

    # Override inherited SPA/error fallbacks for this sensitive endpoint.
    error_page 401 = @app_accounts_unauthorized;
    error_page 403 404 405 500 502 503 504 = @app_accounts_denied;
}

location = /_app_accounts_auth {
    internal;
    proxy_pass https://xboard.example.com/api/v1/user/info;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_set_header Content-Length "";
    proxy_set_header Host xboard.example.com;
    proxy_set_header Accept application/json;
    proxy_set_header Authorization $http_authorization;
    proxy_ssl_server_name on;
    proxy_ssl_name xboard.example.com;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    error_page 401 403 404 500 502 503 504 = @app_accounts_denied;
}

location @app_accounts_unauthorized {
    add_header Cache-Control "private, no-store" always;
    add_header Access-Control-Allow-Origin "https://theme.example.com" always;
    return 401;
}

location @app_accounts_denied {
    add_header Cache-Control "private, no-store" always;
    add_header Access-Control-Allow-Origin "https://theme.example.com" always;
    return 403;
}

# Retire the previous public URLs, including stale CDN copies separately.
location = /app-accounts.json { return 404; }
location = /public/app-accounts.json { return 404; }
